general.import = [
  # uncomment the flavour you want below:
	# "~/.config/alacritty/sonokai.toml"
	# "~/.config/alacritty/gruvbox_dark.toml"
  	 "~/.config/alacritty/tender.toml"
]

[window]

opacity = 1
decorations = "Full"
decorations_theme_variant = "Dark" #"Light"  

[font]
# linux list fonts cmd= fc-list
normal = { family = "Iosevka Custom", style = "Regular" }
bold = { family = "Iosevka Custom", style = "Bold" }
italic = { family = "Iosevka Custom", style = "Italic" }
bold_italic = { family = "Iosevka Custom", style = "Bold Italic" }
size = 17.0

[cursor]
style = { shape = "Beam", blinking = "Off" }
